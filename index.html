<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
  <section class="section-info">
    <img class="section-info__img" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix">
    <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </section>
  <section class="main-section">
    <h3 class="title-task title-task__add">Add Item</h3>
    <div class="add-new-task">
      <input id="new-task" class="input-task input-task__add" type="text">
      <button class="button add__button">Add</button>
    </div>
    <h3 class="title-task">Todo</h3>
    <ul id="incomplete-tasks">
      <li>
        <input class="checkbox" type="checkbox">
        <label class="task">Pay Bills</label>
        <input type="text" class="input-task input-task__li input-task__edit">
        <button class="button edit__button">Edit</button>
        <button class="button delete__button">
          <img class="delete__button__img" src="./remove.svg" alt="Button for removing task">
        </button>
      </li>
      <li class="edit-mode">
        <input class="checkbox" type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="input-task input-task__li input-task__edit">
        <button class="button edit__button">Save</button>
        <button class="button delete__button">
          <img class="delete__button__img" src="./remove.svg" alt="Button for removing task">
        </button>
      </li>
    </ul>
    <h3 class="title-task">Completed</h3>
    <ul id="completed-tasks">
      <li>
        <input class="checkbox" type="checkbox" checked>
        <label class="task task__line-through">See the Doctor</label>
        <input type="text" class="input-task input-task__li input-task__edit">
        <button class="button edit__button">Edit</button>
        <button class="button delete__button">
          <img class="delete__button__img" src="./remove.svg" alt="Button for removing task">
        </button>
      </li>
    </ul>
  </section>
  <script src="app.js"></script>
</body>
</html>
